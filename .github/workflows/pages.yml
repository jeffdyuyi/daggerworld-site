name: Deploy Daggerworld
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Name this attempt’s artifact
        id: artifact
        run: echo "name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:adventure
      - name: Stage website
        run: |
          mkdir -p _site
          cp index.html account.html session.js portal-account.js pixel-theme.css news-archive.js _site/
          tar --exclude=editor/assets/lpc --exclude=editor/paperdoll.js -cf - editor assets | tar -xf - -C _site
      - name: Stage fantasy-paperdoll
        run: |
          git clone --depth 1 https://github.com/jeffdyuyi/DHworld-avatar.git _site/fantasy-paperdoll
      - name: Stage shared adventure canvas
        run: |
          cp -R dist/adventure-canvas _site/
          test -s _site/adventure-canvas/index.html
          cp -R node_modules/@excalidraw/excalidraw/dist/prod/fonts _site/adventure-canvas/
          test -d _site/adventure-canvas/fonts
      - name: Verify staged editor modules
        run: |
          node --input-type=module <<'JS'
          globalThis.window = { addEventListener() {}, setInterval() {} };
          globalThis.location = { replace() {} };
          await import('./_site/editor/app.js');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: _site
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.publish.outputs.artifact }}
