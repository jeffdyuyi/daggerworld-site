<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游戏入口｜匕首世界</title>
  <link rel="stylesheet" href="./pixel-theme.css">
</head>
<body class="game-entry">
  <header class="entry-header">
    <a class="entry-brand" href="./index.html#top">匕首世界</a>
    <a class="entry-back" href="./index.html#top">官网首页</a>
  </header>
  <main class="entry-stage">
    <div class="entry-title">
      <p>重启内测</p>
      <h1>匕首世界</h1>
    </div>
    <section class="entry-panel" aria-labelledby="entry-title">
      <h2 id="entry-title">进入游戏</h2>
      <form id="login">
        <label>玩家名称或邮箱
          <input name="login" autocomplete="username" maxlength="100" required>
        </label>
        <label>内测激活码
          <input name="code" type="password" autocomplete="current-password" required>
        </label>
        <button class="entry-primary">激活并登录</button>
      </form>
      <div id="signed" hidden>
        <p id="greeting"></p>
        <a class="entry-primary" id="editor" href="./editor/#vault">进入角色库</a>
        <button class="entry-back" type="button" id="sign-out">退出登录</button>
      </div>
      <p id="status" role="status"></p>
    </section>
  </main>
<script type="module">
import { login, readSession, loadAccount, signOut } from './session.js';
const form = document.getElementById('login');
const signed = document.getElementById('signed');
const status = document.getElementById('status');
const button = form.querySelector('button');
async function showAccount() {
  if (!readSession()) return;
  const account = await loadAccount();
  form.hidden = true;
  signed.hidden = false;
  document.getElementById('greeting').textContent = '欢迎，' + account.login;
  document.getElementById('entry-title').textContent = '选择角色';
}
form.addEventListener('submit', async event => {
  event.preventDefault();
  const data = new FormData(form);
  button.disabled = true;
  status.textContent = '正在验证激活码…';
  try {
    await login(data.get('login'), data.get('code'));
    form.reset();
    await showAccount();
    status.textContent = '';
  } catch (error) { status.textContent = error.message; }
  finally { button.disabled = false; }
});
document.getElementById('sign-out').addEventListener('click', async () => {
  await signOut();
  location.reload();
});
showAccount().catch(error => { status.textContent = error.message; });
</script>
</body>
</html>
