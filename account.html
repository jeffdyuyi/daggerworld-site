<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游戏入口｜匕首世界</title>
  <link rel="stylesheet" href="./pixel-theme.css">
<link rel="stylesheet" href="./assets/dark-fantasy/theme.css">
<link rel="stylesheet" href="./assets/dark-fantasy/site.css">
</head>
<body class="game-entry">
  <header class="entry-header">
    <a class="entry-brand" href="./index.html#top">匕首世界</a>
    <a class="entry-back" href="./index.html#top">官网首页</a>
  </header>
  <main class="entry-stage">
    <div class="entry-title">
      <p>重启内测</p>
      <h1>匕首世界</h1>
    </div>
    <section class="entry-panel" aria-labelledby="entry-title">
      <h2 id="entry-title">进入游戏</h2>
      <form id="login">
        <label>玩家名称或邮箱
          <input name="login" id="login-name-input" autocomplete="username" maxlength="100" required placeholder="输入账号名称">
        </label>
        <label>内测激活码
          <input name="code" id="activation-code-input" type="text" autocomplete="current-password" required placeholder="输入邀请码">
        </label>
        <button class="entry-primary">激活并登录</button>
      </form>
      <div id="signed" hidden>
        <p id="greeting" style="font-size:1.1rem;font-weight:bold;color:#f8dfad;margin-bottom:0.5rem;"></p>
        
        <div id="gm-banner" style="display:none;background:#2d1b12;border:1px solid #b87a3b;padding:8px 12px;border-radius:4px;font-size:12px;color:#ffebb8;margin-bottom:10px;">
          👑 <strong>主持人 (GM) 权限已激活</strong><br>
          踏入主城后可使用右上角【GM调度台】派发战役任务、投放资源并掌控战术战斗场景。
        </div>

        <div style="margin-bottom:12px;">
          <label style="font-size:12px;color:#c9baa7;margin-bottom:4px;display:block;">选择进入主城漫游的角色：</label>
          <div id="character-tiles" style="display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;padding-right:4px;">
            <!-- 动态渲染角色选择瓷砖 -->
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:8px;">
          <button type="button" class="entry-primary" id="btn-enter-mmo" style="background:linear-gradient(135deg, #8b3d22, #5a2012);border:1px solid #d4af37;padding:10px 14px;font-size:15px;font-weight:bold;color:#fff;cursor:pointer;">
            🏰 踏入安乡主城 (进入 3D MMO)
          </button>
          <div style="display:flex;gap:8px;">
            <a class="entry-primary" id="editor" href="./editor/#vault" style="flex:1;text-align:center;text-decoration:none;font-size:13px;padding:8px;">📜 角色卡库</a>
            <a class="entry-primary" id="entry-workshop-link" href="./editor/#workshop" style="flex:1;display:none;background:linear-gradient(135deg, #d97706, #b45309);text-align:center;text-decoration:none;border-color:#f59e0b;font-size:13px;padding:8px;">🛠️ 主持人工坊</a>
          </div>
        </div>
        <button class="entry-back" type="button" id="sign-out" style="margin-top:12px;">退出登录</button>
      </div>
      <p id="status" role="status"></p>
    </section>
  </main>
<script type="module">
import { login, readSession, loadAccount, signOut } from './session.js?v=20261121-auth2';
const form = document.getElementById('login');
const signed = document.getElementById('signed');
const status = document.getElementById('status');
const button = form.querySelector('button');

let selectedCharacter = null;

async function showAccount() {
  if (!readSession()) return;
  const account = await loadAccount();
  const gm = account.role === 'gm';
  form.hidden = true;
  signed.hidden = false;
  document.getElementById('greeting').textContent = '欢迎，' + account.login;
  document.getElementById('entry-title').textContent = gm ? '主持人操作台' : '选择角色进入主城';
  document.getElementById('entry-workshop-link').style.display = gm ? '' : 'none';
  document.getElementById('gm-banner').style.display = gm ? 'block' : 'none';

  const tilesContainer = document.getElementById('character-tiles');
  tilesContainer.innerHTML = '';

  const chars = Array.isArray(account.characters) ? account.characters : [];
  selectedCharacter = chars[0] ?? null;
  if (!chars.length && !gm) tilesContainer.textContent = '还没有角色，请先进入角色库创建角色。';

  chars.forEach((c, idx) => {
    const tile = document.createElement('div');
    tile.className = 'character-tile';
    tile.style.cssText = `
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border: 1px solid ${idx === 0 ? '#e6af42' : '#45352b'};
      background: ${idx === 0 ? '#38251b' : '#1e1814'};
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    `;
    const name = c.sheet?.name || c.avatar_name || '无名冒险者';
    const lvl = c.level || c.sheet?.level || 1;
    const cls = c.sheet?.class || c.sheet?.职业 || '冒险者';
    const caption = document.createElement('strong');
    caption.textContent = name;
    const detail = document.createElement('span');
    detail.textContent = 'Lv.' + lvl + ' · ' + cls;
    tile.append(caption, detail);
    tile.onclick = () => {
      selectedCharacter = c;
      tilesContainer.querySelectorAll('.character-tile').forEach(t => {
        t.style.border = '1px solid #45352b';
        t.style.background = '#1e1814';
      });
      tile.style.border = '1px solid #e6af42';
      tile.style.background = '#38251b';
    };
    tilesContainer.appendChild(tile);
  });

  const enterBtn = document.getElementById('btn-enter-mmo');
  if (account.role === 'gm') {
    enterBtn.textContent = '👑 以主持人身份直接进入 3D MMO（无需角色）';
  }

  enterBtn.disabled = !gm && !chars.length;
  enterBtn.onclick = () => {
    const isGm = account.role === 'gm';
    if (!selectedCharacter && !isGm) {
      alert('请先选择一个角色！');
      return;
    }
    // 写入跨站共享契约存储（主持人无需角色，以 GM 观察/编导身份直接进入）
    if (isGm && (!Array.isArray(account.characters) || account.characters.length === 0)) {
      localStorage.removeItem('daggerworld.active_character.v1');
    } else if (selectedCharacter) {
      localStorage.setItem('daggerworld.active_character.v1', JSON.stringify(selectedCharacter));
    }
    localStorage.setItem('daggerworld.mmo_entry_state.v1', JSON.stringify({
      role: account.role,
      mode: isGm && (!Array.isArray(account.characters) || account.characters.length === 0) ? 'gm_observer' : 'character',
      characterId: isGm && (!Array.isArray(account.characters) || account.characters.length === 0) ? null : selectedCharacter?.id,
      login: account.login,
      enteredAt: new Date().toISOString()
    }));

    window.location.href = './mmo/';
  };
}
form.addEventListener('submit',async event => {
  event.preventDefault();
  const data = new FormData(form);
  button.disabled = true;
  status.textContent = '正在验证激活码…';
  try {
    await login(data.get('login'),data.get('code'));
    await showAccount();
    form.reset();
    status.textContent = '';
  } catch(error) { status.textContent = error.message; }
  finally { button.disabled = false; }
});
document.getElementById('sign-out').addEventListener('click', async () => {
  await signOut();
  location.reload();
});
showAccount().catch(error => { status.textContent = error.message; });
</script>
</body>
</html>
